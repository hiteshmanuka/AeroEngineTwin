version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: aeroenginetwin-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {POSTGRES_USER} -d {POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: aeroenginetwin-seaweedfs
    restart: unless-stopped
    command: "server -s3 -dir=/data -master.volumeSizeLimitMB=1024"
    ports:
      - "9333:9333"   # master
      - "8080:8080"   # volume server
      - "8333:8333"   # S3 API gateway
    volumes:
      - seaweedfs_data:/data

volumes:
  timescaledb_data:
  seaweedfs_data: