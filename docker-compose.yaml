version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: aeroenginetwin-timescaledb
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {POSTGRES_USER} -d {POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    env_file: .env
    container_name: ${SEAWEED_CONTAINER}
    restart: unless-stopped
    command: "server -s3 -dir=/data -master.volumeSizeLimitMB=1024"
    ports:
      - "9333:9333"   # master
      - "8080:8080"   # volume server
      - "8333:8333"   # S3 API gateway
    volumes:
      - seaweedfs_data:/data
  
  infra-init:
    build: .
    container_name: aeroenginetwin-infra-init
    depends_on:
      timescaledb:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    env_file: .env
    command: python ${TIMESCALE_INIT} && python ${SEAWEED_INIT}
    restart: "no"

volumes:
  timescaledb_data:
  seaweedfs_data: